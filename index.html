<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy-Study</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
        }
        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #cbd5e1;
        }
        :root[data-theme="green"] {
            --bg-color: #064e3b;
            --card-bg: #065f46;
            --text-color: #ecfdf5;
            --text-muted: #a7f3d0;
            --primary: #10b981;
            --primary-hover: #059669;
            --border-color: #047857;
        }
        :root[data-theme="sunset"] {
            --bg-color: #451a03;
            --card-bg: #78350f;
            --text-color: #fef3c7;
            --text-muted: #fde68a;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --border-color: #92400e;
        }
        :root[data-theme="cyber"] {
            --bg-color: #2e1065;
            --card-bg: #4c1d95;
            --text-color: #f3e8ff;
            --text-muted: #d8b4fe;
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --border-color: #6b21a8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .card-bg { background-color: var(--card-bg); border-color: var(--border-color); }
        .text-muted-custom { color: var(--text-muted); }
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- ヘッダー -->
        <header class="flex justify-between items-center card-bg p-4 rounded-2xl border shadow-sm relative">
            <div>
                <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                    ⏱️ Handy-Study
                </h1>
                <p class="text-xs text-muted-custom mt-1">手元を撮影・AI判定して毎日の勉強を確実に記録</p>
            </div>
            
            <!-- メニューボタン -->
            <div class="relative">
                <button id="menu-btn" class="p-2.5 px-4 rounded-xl card-bg border hover:opacity-80 transition cursor-pointer font-bold flex items-center gap-2">
                    🍔 メニュー
                </button>
                <!-- ドロップダウンメニュー -->
                <div id="menu-dropdown" class="absolute right-0 mt-2 w-52 card-bg border rounded-xl shadow-xl py-2 hidden z-40">
                    <button id="open-stats-btn" class="w-full text-left px-4 py-2 hover:bg-white/10 text-sm flex items-center gap-2 cursor-pointer">
                        📜 学習成績・詳細
                    </button>
                    <button id="open-settings-btn" class="w-full text-left px-4 py-2 hover:bg-white/10 text-sm flex items-center gap-2 cursor-pointer border-t border-white/5">
                        ⚙️ アプリ設定
                    </button>
                    <button id="menu-clear-logs-btn" class="w-full text-left px-4 py-2 hover:bg-red-500/20 text-red-400 text-sm flex items-center gap-2 cursor-pointer border-t border-white/5 font-semibold">
                        🗑️ 全データ消去
                    </button>
                </div>
            </div>
        </header>

        <!-- メイングリッド -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 左カラム：タイマーとカメラ -->
            <div class="space-y-6">
                
                <!-- タイマーカード -->
                <div class="card-bg p-6 rounded-2xl border shadow-sm text-center relative overflow-hidden">
                    <div id="mode-badge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold mb-2 bg-blue-500/20 text-blue-400">
                        集中タイム
                    </div>

                    <!-- 教科選択エリア -->
                    <div class="my-2 flex justify-center items-center gap-2">
                        <label class="text-xs text-muted-custom">📚 学習教科:</label>
                        <select id="subject-select" class="card-bg border text-xs px-3 py-1.5 rounded-lg cursor-pointer font-semibold">
                            <option value="英語">英語</option>
                            <option value="数学">数学</option>
                            <option value="国語">国語</option>
                            <option value="理科">理科</option>
                            <option value="社会">社会</option>
                            <option value="プログラミング">プログラミング</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    
                    <div id="timer-display" class="text-6xl font-extrabold tracking-wider my-3 font-mono">
                        25:00
                    </div>

                    <!-- カウントダウン表示オーバーレイ -->
                    <div id="countdown-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-xs flex flex-col items-center justify-center hidden z-10">
                        <p class="text-xs text-muted-custom mb-2">セッション開始まで</p>
                        <div id="countdown-number" class="text-7xl font-black text-blue-400 animate-bounce">3</div>
                    </div>

                    <div class="flex justify-center gap-3 mt-4">
                        <button id="start-btn" class="btn-primary text-white px-6 py-3 rounded-xl font-bold transition shadow-md cursor-pointer">
                            スタート
                        </button>
                        <button id="pause-btn" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-xl font-bold transition shadow-md cursor-pointer hidden">
                            一時停止
                        </button>
                        <button id="reset-btn" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-4 py-3 rounded-xl font-bold transition cursor-pointer">
                            リセット
                        </button>
                    </div>

                    <div class="mt-4 text-xs text-muted-custom flex justify-center items-center gap-2">
                        <label class="flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" id="test-mode-toggle" class="rounded"> テストモード(短縮タイマー)
                        </label>
                    </div>
                </div>

                <!-- カメラプレビューカード -->
                <div class="card-bg p-4 rounded-2xl border shadow-sm">
                    <h2 class="text-sm font-semibold mb-2 flex items-center justify-between">
                        <span>📷 手元カメラ映像</span>
                        <span id="camera-status" class="text-xs text-muted-custom">未接続</span>
                    </h2>
                    <div class="relative rounded-xl overflow-hidden bg-black aspect-video flex items-center justify-center">
                        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
                        <canvas id="snapshot-canvas" class="hidden"></canvas>
                        <div id="camera-placeholder" class="absolute text-xs text-gray-400 text-center p-4">
                            「スタート」を押すとカメラの許可とカウントダウンが始まります
                        </div>
                    </div>
                </div>

            </div>

            <!-- 右カラム：AI判定結果とグラフ -->
            <div class="space-y-6 flex flex-col">
                
                <!-- AI判定結果カード -->
                <div class="card-bg p-6 rounded-2xl border shadow-sm flex-1">
                    <h2 class="text-sm font-semibold mb-3">🤖 直近のAI判定結果</h2>
                    <div id="ai-result-box" class="p-4 rounded-xl bg-black/20 border border-white/5 space-y-2 min-h-[140px] flex flex-col justify-center items-center text-center">
                        <p class="text-sm text-muted-custom">まだセッションが完了していません。<br>タイマーを完了して判定を受けましょう。</p>
                    </div>
                </div>

                <!-- 勉強記録グラフカード -->
                <div class="card-bg p-6 rounded-2xl border shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-semibold">📊 勉強時間の記録 (教科別・過去7日間)</h2>
                        <span id="today-total-badge" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-blue-500/20 text-blue-400">今日: 0分</span>
                    </div>
                    <div class="h-44">
                        <canvas id="study-chart"></canvas>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="card-bg max-w-md w-full p-6 rounded-2xl border shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold">⚙️ アプリ設定</h2>
                <button id="close-settings-btn" class="text-muted-custom hover:text-white font-bold text-xl cursor-pointer">&times;</button>
            </div>

            <div class="space-y-4 text-sm">
                <!-- 判定モード選択 -->
                <div>
                    <label class="block font-semibold mb-1">AI判定モード</label>
                    <select id="ai-mode-select" class="w-full p-2.5 rounded-xl card-bg border text-sm">
                        <option value="gemini">通常 (Gemini API を使用)</option>
                        <option value="dummy">ダミー / オフラインテスト (即座に成功判定)</option>
                    </select>
                </div>

                <!-- APIキー設定 -->
                <div id="api-key-container">
                    <label class="block font-semibold mb-1">Gemini API Key</label>
                    <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full p-2.5 rounded-xl card-bg border text-sm">
                    <p class="text-xs text-muted-custom mt-1">※ブラウザ内(localStorage)にのみ安全に保存されます。</p>
                </div>

                <!-- カラーテーマ設定 -->
                <div>
                    <label class="block font-semibold mb-1">カラーテーマ</label>
                    <select id="theme-select" class="w-full p-2.5 rounded-xl card-bg border text-sm">
                        <option value="dark">ダーク（標準黒）</option>
                        <option value="light">ライト（クリーン白）</option>
                        <option value="green">フォレストグリーン</option>
                        <option value="sunset">サンセット（オレンジ系）</option>
                        <option value="cyber">サイバー（パープル系）</option>
                    </select>
                </div>

                <!-- アラーム音設定 -->
                <div>
                    <label class="block font-semibold mb-1">タイマー終了時のアラーム音</label>
                    <select id="alarm-select" class="w-full p-2.5 rounded-xl card-bg border text-sm">
                        <option value="beep">電子音 (ピピピ)</option>
                        <option value="bell">チャイム (ベル)</option>
                        <option value="soft">ソフト (ポロロン)</option>
                        <option value="none">鳴らさない</option>
                    </select>
                    <button id="test-sound-btn" class="mt-2 text-xs text-blue-400 hover:underline cursor-pointer">🔊 音をテスト再生する</button>
                </div>

                <!-- 時間カスタマイズ -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold mb-1">集中時間 (分)</label>
                        <input type="number" id="work-time-input" value="25" min="1" max="120" class="w-full p-2.5 rounded-xl card-bg border text-sm">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">休憩時間 (分)</label>
                        <input type="number" id="break-time-input" value="5" min="1" max="60" class="w-full p-2.5 rounded-xl card-bg border text-sm">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button id="save-settings-btn" class="btn-primary text-white px-5 py-2.5 rounded-xl font-bold transition text-sm cursor-pointer">
                    保存して閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- 学習成績モーダル -->
    <div id="stats-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="card-bg max-w-lg w-full p-6 rounded-2xl border shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h2 class="text-lg font-bold flex items-center gap-2">📜 学習履歴・教科別内訳</h2>
                <button id="close-stats-btn" class="text-muted-custom hover:text-white font-bold text-xl cursor-pointer">&times;</button>
            </div>

            <div class="space-y-6">
                <!-- 教科別内訳（円グラフ + 集計） -->
                <div>
                    <h3 class="text-sm font-semibold mb-3">📚 教科別学習時間 (累計)</h3>
                    <div class="flex flex-col md:flex-row items-center gap-4">
                        <div class="w-40 h-40 relative">
                            <canvas id="subject-pie-chart"></canvas>
                        </div>
                        <div id="subject-list" class="flex-1 space-y-1 text-xs w-full">
                            <!-- JSで動的生成 -->
                        </div>
                    </div>
                </div>

                <!-- 履歴クリアボタン -->
                <div class="pt-2 border-t border-white/10 flex justify-between items-center">
                    <span class="text-xs text-muted-custom">※データはブラウザ内に保存されています</span>
                    <button id="clear-logs-btn" class="text-xs text-red-400 hover:underline cursor-pointer">
                        🗑️ データを全消去
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScriptロジック -->
    <script>
        const SUBJECT_COLORS = {
            '英語': '#3b82f6',
            '数学': '#10b981',
            '国語': '#f59e0b',
            '理科': '#ec4899',
            '社会': '#8b5cf6',
            'プログラミング': '#6366f1',
            'その他': '#64748b'
        };

        let settings = {
            aiMode: localStorage.getItem('ai_mode') || 'gemini',
            apiKey: localStorage.getItem('gemini_api_key') || '',
            theme: localStorage.getItem('app_theme') || 'dark',
            alarmType: localStorage.getItem('alarm_type') || 'beep',
            workMinutes: parseInt(localStorage.getItem('work_minutes')) || 25,
            breakMinutes: parseInt(localStorage.getItem('break_minutes')) || 5
        };

        let isRunning = false;
        let isWorkMode = true;
        let timeLeft = settings.workMinutes * 60;
        let timerInterval = null;
        let lastCapturedBase64 = null;

        const timerDisplay = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modeBadge = document.getElementById('mode-badge');
        const testModeToggle = document.getElementById('test-mode-toggle');
        const subjectSelect = document.getElementById('subject-select');
        const webcam = document.getElementById('webcam');
        const snapshotCanvas = document.getElementById('snapshot-canvas');
        const cameraStatus = document.getElementById('camera-status');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        const aiResultBox = document.getElementById('ai-result-box');
        const todayTotalBadge = document.getElementById('today-total-badge');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownNumber = document.getElementById('countdown-number');

        // メニュー＆モーダル関連
        const menuBtn = document.getElementById('menu-btn');
        const menuDropdown = document.getElementById('menu-dropdown');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const openStatsBtn = document.getElementById('open-stats-btn');
        const menuClearLogsBtn = document.getElementById('menu-clear-logs-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const statsModal = document.getElementById('stats-modal');
        const closeStatsBtn = document.getElementById('close-stats-btn');
        const clearLogsBtn = document.getElementById('clear-logs-btn');

        const aiModeSelect = document.getElementById('ai-mode-select');
        const apiKeyContainer = document.getElementById('api-key-container');
        const apiKeyInput = document.getElementById('api-key-input');
        const themeSelect = document.getElementById('theme-select');
        const alarmSelect = document.getElementById('alarm-select');
        const workTimeInput = document.getElementById('work-time-input');
        const breakTimeInput = document.getElementById('break-time-input');
        const testSoundBtn = document.getElementById('test-sound-btn');

        menuBtn.onclick = (e) => {
            e.stopPropagation();
            menuDropdown.classList.toggle('hidden');
        };
        document.onclick = () => menuDropdown.classList.add('hidden');

        function applySettings() {
            document.documentElement.setAttribute('data-theme', settings.theme);
            aiModeSelect.value = settings.aiMode;
            apiKeyInput.value = settings.apiKey;
            themeSelect.value = settings.theme;
            alarmSelect.value = settings.alarmType;
            workTimeInput.value = settings.workMinutes;
            breakTimeInput.value = settings.breakMinutes;

            if (settings.aiMode === 'dummy') {
                apiKeyContainer.style.display = 'none';
            } else {
                apiKeyContainer.style.display = 'block';
            }

            if (!isRunning && isWorkMode) {
                timeLeft = settings.workMinutes * 60;
                updateTimerDisplay();
            }
        }
        applySettings();

        aiModeSelect.onchange = () => {
            apiKeyContainer.style.display = (aiModeSelect.value === 'dummy') ? 'none' : 'block';
        };

        openSettingsBtn.onclick = () => {
            menuDropdown.classList.add('hidden');
            settingsModal.classList.remove('hidden');
        };
        closeSettingsBtn.onclick = () => settingsModal.classList.add('hidden');
        saveSettingsBtn.onclick = () => {
            settings.aiMode = aiModeSelect.value;
            settings.apiKey = apiKeyInput.value.trim();
            settings.theme = themeSelect.value;
            settings.alarmType = alarmSelect.value;
            settings.workMinutes = Math.max(1, parseInt(workTimeInput.value) || 25);
            settings.breakMinutes = Math.max(1, parseInt(breakTimeInput.value) || 5);

            localStorage.setItem('ai_mode', settings.aiMode);
            localStorage.setItem('gemini_api_key', settings.apiKey);
            localStorage.setItem('app_theme', settings.theme);
            localStorage.setItem('alarm_type', settings.alarmType);
            localStorage.setItem('work_minutes', settings.workMinutes);
            localStorage.setItem('break_minutes', settings.breakMinutes);

            applySettings();
            settingsModal.classList.add('hidden');
        };

        openStatsBtn.onclick = () => {
            menuDropdown.classList.add('hidden');
            renderSubjectStats();
            statsModal.classList.remove('hidden');
        };
        closeStatsBtn.onclick = () => statsModal.classList.add('hidden');

        function playAlarmSound(type = 'beep') {
            if (type === 'none') return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'beep') {
                    [0, 200, 400].forEach(delay => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.15);
                        }, delay);
                    });
                } else if (type === 'bell') {
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.8);
                        }, i * 150);
                    });
                } else if (type === 'soft') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch(e) {}
        }

        testSoundBtn.onclick = () => playAlarmSound(alarmSelect.value);

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                webcam.srcObject = stream;
                cameraStatus.textContent = "接続中 (OK)";
                cameraStatus.className = "text-xs text-green-400 font-semibold";
                cameraPlaceholder.style.display = 'none';
                return true;
            } catch (err) {
                cameraStatus.textContent = "カメラエラー・未許可";
                cameraStatus.className = "text-xs text-red-400 font-semibold";
                alert("カメラの使用許可が必要です。ブラウザの設定からカメラを許可してください。");
                return false;
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
        }

        startBtn.onclick = async () => {
            if (!webcam.srcObject) {
                const cameraReady = await startCamera();
                if (!cameraReady) return;
            }

            countdownOverlay.classList.remove('hidden');
            let count = 3;
            countdownNumber.textContent = count;

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNumber.textContent = count;
                } else {
                    clearInterval(countdownInterval);
                    countdownOverlay.classList.add('hidden');
                    beginTimerLoop();
                }
            }, 1000);
        };

        function beginTimerLoop() {
            isRunning = true;
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            testModeToggle.disabled = true;
            subjectSelect.disabled = true;

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    playAlarmSound(settings.alarmType);

                    if (isWorkMode) {
                        captureAndEvaluate();
                        saveStudyLog(settings.workMinutes, subjectSelect.value);
                        updateChart();

                        isWorkMode = false;
                        timeLeft = (testModeToggle.checked ? 5 : settings.breakMinutes) * 60;
                        modeBadge.textContent = "休憩タイム";
                        modeBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold mb-2 bg-green-500/20 text-green-400";
                    } else {
                        isWorkMode = true;
                        timeLeft = (testModeToggle.checked ? 10 : settings.workMinutes) * 60;
                        modeBadge.textContent = "集中タイム";
                        modeBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold mb-2 bg-blue-500/20 text-blue-400";
                    }

                    isRunning = false;
                    startBtn.textContent = isWorkMode ? "次のセッションを開始" : "休憩を開始";
                    startBtn.classList.remove('hidden');
                    pauseBtn.classList.add('hidden');
                    testModeToggle.disabled = false;
                    subjectSelect.disabled = false;
                }
            }, 1000);
        }

        pauseBtn.onclick = () => {
            isRunning = false;
            clearInterval(timerInterval);
            pauseBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            testModeToggle.disabled = false;
            subjectSelect.disabled = false;
        };

        resetBtn.onclick = () => {
            isRunning = false;
            clearInterval(timerInterval);
            isWorkMode = true;
            timeLeft = (testModeToggle.checked ? 10 : settings.workMinutes) * 60;
            updateTimerDisplay();
            modeBadge.textContent = "集中タイム";
            modeBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold mb-2 bg-blue-500/20 text-blue-400";
            startBtn.textContent = "スタート";
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            testModeToggle.disabled = false;
            subjectSelect.disabled = false;
        };

        testModeToggle.onchange = () => {
            if (!isRunning) {
                timeLeft = testModeToggle.checked ? 10 : settings.workMinutes * 60;
                updateTimerDisplay();
            }
        };

        function captureAndEvaluate() {
            try {
                const targetWidth = 480;
                const targetHeight = 270;
                snapshotCanvas.width = targetWidth;
                snapshotCanvas.height = targetHeight;
                const ctx = snapshotCanvas.getContext('2d');
                ctx.drawImage(webcam, 0, 0, targetWidth, targetHeight);
                lastCapturedBase64 = snapshotCanvas.toDataURL('image/jpeg', 0.4).split(',')[1];
            } catch(e) {
                console.error("Capture error", e);
            }

            if (settings.aiMode === 'dummy') {
                runDummyEvaluation();
            } else {
                triggerAiEvaluationWithRetry();
            }
        }

        function runDummyEvaluation() {
            aiResultBox.innerHTML = `
                <div class="text-left w-full space-y-2 p-3 rounded-xl border bg-emerald-500/20 text-emerald-400 border-emerald-500/30">
                    <div class="font-extrabold text-sm flex items-center justify-between">
                        <span>🔥 【判定：集中成功】 (ダミーテスト)</span>
                    </div>
                    <p class="text-xs text-slate-200 whitespace-pre-wrap leading-relaxed">コメント：[${subjectSelect.value}]の学習を確認しました！手元にノートが開かれており、素晴らしい集中力です。</p>
                </div>
            `;
        }

        async function triggerAiEvaluationWithRetry() {
            const maxRetries = 3;
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    aiResultBox.innerHTML = `<p class="text-xs text-blue-400 animate-pulse">🤖 Gemini AI解析中 (試行回数 ${attempt}/${maxRetries})...</p>`;
                    const success = await executeAiCall();
                    if (success) return;
                } catch (err) {
                    if (attempt === maxRetries) {
                        showErrorWithRetry("サーバー混雑が続いています。設定から「ダミー判定モード」に切り替えるとテストがスムーズに行えます。");
                        return;
                    }
                    await new Promise(resolve => setTimeout(resolve, attempt * 2000));
                }
            }
        }

        async function executeAiCall() {
            if (!settings.apiKey) {
                aiResultBox.innerHTML = `<p class="text-xs text-yellow-400">⚠️ APIキーが未設定です。<br>設定(⚙️)からAPIキーを入力するか、ダミーモードをご利用ください。</p>`;
                return true;
            }

            if (!lastCapturedBase64) {
                aiResultBox.innerHTML = `<p class="text-xs text-yellow-400">⚠️ キャプチャ画像がありません。</p>`;
                return true;
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${settings.apiKey}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 25000);

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller.signal,
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: `この画像は「${subjectSelect.value}」の勉強中の手元を撮影したものです。1. ちゃんと勉強（机に向かい、本やノート、筆記用具、PC等を使用）しているか、2. スマホを触ってサボっていないか、を判定してください。必ず冒頭に「【判定：集中成功】」または「【判定：サボり気味】」のいずれかを書き、その後に続けて短いアドバイスを日本語で出力してください。` },
                            { inlineData: { mimeType: "image/jpeg", data: lastCapturedBase64 } }
                        ]
                    }]
                })
            });

            clearTimeout(timeoutId);
            const data = await response.json();

            if (data.error) throw new Error(data.error.message || 'APIエラー');

            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "判定結果を取得できませんでした。";
            let isSuccess = text.includes("集中成功") || !text.includes("サボり");
            let badgeClass = isSuccess ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" : "bg-rose-500/20 text-rose-400 border-rose-500/30";
            let statusTitle = isSuccess ? "🔥 判定：集中成功！よく頑張っています" : "⚠️ 判定：サボり気味（要注意）";

            aiResultBox.innerHTML = `
                <div class="text-left w-full space-y-2 p-3 rounded-xl border ${badgeClass}">
                    <div class="font-extrabold text-sm flex items-center justify-between">
                        <span>${statusTitle}</span>
                        <button onclick="triggerAiEvaluationWithRetry()" class="text-xs bg-black/40 hover:bg-black/60 px-2 py-1 rounded cursor-pointer text-white font-normal">🔄 再試行</button>
                    </div>
                    <p class="text-xs text-slate-200 whitespace-pre-wrap leading-relaxed">${text}</p>
                </div>
            `;
            return true;
        }

        function showErrorWithRetry(errorMsg) {
            aiResultBox.innerHTML = `
                <div class="text-center space-y-2 p-3 rounded-xl border bg-red-500/10 border-red-500/30">
                    <p class="text-xs text-red-400 font-semibold">❌ ${errorMsg}</p>
                    <div class="flex justify-center gap-2 mt-2">
                        <button onclick="triggerAiEvaluationWithRetry()" class="text-xs btn-primary text-white px-3 py-2 rounded-xl font-bold transition shadow cursor-pointer">
                            🔄 再試行
                        </button>
                        <button onclick="openSettingsBtn.click()" class="text-xs bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded-xl font-bold transition shadow cursor-pointer">
                            ⚙️ ダミーモードに変更する
                        </button>
                    </div>
                </div>
            `;
        }

        // 勉強記録データ管理（日付＋教科ごとの詳細構造）
        let detailedStudyLogs = JSON.parse(localStorage.getItem('detailed_study_logs') || '{}');
        let subjectLogs = JSON.parse(localStorage.getItem('subject_logs') || '{}');

        // 後方互換性：旧形式データを引き継ぐ処理
        if (localStorage.getItem('study_logs') && Object.keys(detailedStudyLogs).length === 0) {
            const oldLogs = JSON.parse(localStorage.getItem('study_logs') || '{}');
            Object.keys(oldLogs).forEach(date => {
                detailedStudyLogs[date] = { 'その他': oldLogs[date] };
            });
            localStorage.setItem('detailed_study_logs', JSON.stringify(detailedStudyLogs));
        }

        function saveStudyLog(minutes, subject) {
            const today = new Date().toISOString().split('T')[0];
            
            if (!detailedStudyLogs[today]) detailedStudyLogs[today] = {};
            detailedStudyLogs[today][subject] = (detailedStudyLogs[today][subject] || 0) + minutes;
            
            subjectLogs[subject] = (subjectLogs[subject] || 0) + minutes;

            localStorage.setItem('detailed_study_logs', JSON.stringify(detailedStudyLogs));
            localStorage.setItem('subject_logs', JSON.stringify(subjectLogs));
            updateTodayBadge();
        }

        function getPast7DaysDates() {
            const dates = [];
            const rawDates = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                rawDates.push(dateStr);
                dates.push(dateStr.slice(5).replace('-', '/'));
            }
            return { dates, rawDates };
        }

        function updateTodayBadge() {
            const today = new Date().toISOString().split('T')[0];
            const todayObj = detailedStudyLogs[today] || {};
            const todayMins = Object.values(todayObj).reduce((a, b) => a + b, 0);
            todayTotalBadge.textContent = `今日: ${todayMins}分`;
        }
        updateTodayBadge();

        // 7日間積み上げ棒グラフの作成
        const chartCtx = document.getElementById('study-chart').getContext('2d');
        const past = getPast7DaysDates();
        const subjects = Object.keys(SUBJECT_COLORS);

        function buildDatasets() {
            return subjects.map(sub => {
                const data = past.rawDates.map(dateStr => {
                    const dayObj = detailedStudyLogs[dateStr] || {};
                    return dayObj[sub] || 0;
                });
                return {
                    label: sub,
                    data: data,
                    backgroundColor: SUBJECT_COLORS[sub],
                    borderRadius: 4
                };
            });
        }

        let studyChart = new Chart(chartCtx, {
            type: 'bar',
            data: {
                labels: past.dates,
                datasets: buildDatasets()
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        stacked: true,
                        grid: { display: false },
                        ticks: { color: '#94a3b8', font: { size: 11 } }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        grid: { color: 'rgba(150, 150, 150, 0.15)' },
                        ticks: { color: '#94a3b8', font: { size: 11 } }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            color: '#94a3b8',
                            font: { size: 10 },
                            boxWidth: 10,
                            padding: 8
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => ` ${context.dataset.label}: ${context.raw} 分`
                        }
                    }
                }
            }
        });

        function updateChart() {
            const updated = getPast7DaysDates();
            studyChart.data.labels = updated.dates;
            studyChart.data.datasets = buildDatasets();
            studyChart.update();
        }

        // 教科別内訳の円グラフ render
        let pieChart = null;
        function renderSubjectStats() {
            const labels = Object.keys(subjectLogs);
            const data = Object.values(subjectLogs);

            const subjectListEl = document.getElementById('subject-list');
            if (labels.length === 0) {
                subjectListEl.innerHTML = `<p class="text-muted-custom">まだ教科別の学習データがありません。</p>`;
                if (pieChart) pieChart.destroy();
                return;
            }

            let html = '';
            let total = data.reduce((a, b) => a + b, 0);
            labels.forEach((sub) => {
                const mins = subjectLogs[sub];
                const pct = Math.round((mins / total) * 100);
                const color = SUBJECT_COLORS[sub] || '#3b82f6';
                html += `
                    <div class="flex justify-between items-center bg-black/20 p-2 rounded-lg border border-white/5">
                        <span class="font-semibold flex items-center gap-1.5">
                            <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${color}"></span>
                            ${sub}
                        </span>
                        <span class="font-mono">${mins}分 (${pct}%)</span>
                    </div>
                `;
            });
            subjectListEl.innerHTML = html;

            const pieCtx = document.getElementById('subject-pie-chart').getContext('2d');
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: labels.map(sub => SUBJECT_COLORS[sub] || '#3b82f6')
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function clearAllData() {
            if (confirm("これまでの学習ログおよび保存データをすべて消去しますか？")) {
                localStorage.removeItem('detailed_study_logs');
                localStorage.removeItem('study_logs');
                localStorage.removeItem('subject_logs');
                detailedStudyLogs = {};
                subjectLogs = {};
                updateTodayBadge();
                updateChart();
                renderSubjectStats();
            }
        }

        clearLogsBtn.onclick = clearAllData;
        menuClearLogsBtn.onclick = () => {
            menuDropdown.classList.add('hidden');
            clearAllData();
        };

        updateTimerDisplay();
    </script>
</body>
</html>
